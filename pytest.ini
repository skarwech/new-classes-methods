[pytest]
testpaths = tests
pythonpath = .
markers =
    unit: fast, pure-logic tests
    integration: whole-script tests with Streamlit's AppTest
    e2e: browser tests that start the app and drive Chromium (run with: pytest -m e2e)
addopts = -m "not e2e"
filterwarnings =
    ignore::DeprecationWarning
